# workers/wrangler.nas.toml — Worker ส่งอีเมลของ IE-Photo จาก admin@ienas.site
#
# ตัวนี้อยู่บัญชีส่วนตัวที่ทีมใช้งานอยู่ (vaumgasem@gmail.com) — okmd-proxy เดิมอยู่บัญชีชุมนุม
# ที่ไม่มีใครเข้าได้แล้ว ดูหัวไฟล์ workers/nas-entry.js
#
# deploy:  npm run worker:nas-deploy
# ไม่ต้องตั้ง Secret — ยืนยันตัวด้วยการถาม PocketBase บน NAS (PB_URL)
account_id = "c120ec1f85adbda4cb1a94e4e79cf22d"
name = "iephoto-nas"
main = "nas-entry.js"
compatibility_date = "2026-09-01"

[vars]
# เว็บย้ายมา NAS แล้ว — คงโดเมนเดิมไว้ช่วงเปลี่ยนผ่าน (คั่นด้วย ,)
ALLOWED_ORIGIN = "https://iephoto.ienas.site,https://iephoto.web.app"
# PocketBase บน NAS (ผ่าน Cloudflare Tunnel) — ใช้ยืนยัน token ของคนที่ยิงมา
PB_URL = "https://iephoto.ienas.site"

# ── อีเมลแจ้งเตือน (workers/notify.js) ─────────────────────────
# ienas.site เปิด Email Sending ไว้แล้วใน Cloudflare (Email Service → Email Sending)
MAIL_FROM = "admin@ienas.site"
NOTIFY_TO = "68030271@kmitl.ac.th"

# ไม่ล็อกผู้รับที่ binding เพราะต้องส่งยืนยันถึงตัวน้องที่ขอยืมด้วย (อีเมลเปลี่ยนไปตามคน)
# ความปลอดภัยอยู่ที่โค้ดแทน: /notify ส่งได้แค่ NOTIFY_TO กับอีเมลของคนที่ล็อกอิน
# ส่วน /mail (กำหนดผู้รับได้) ยอมเฉพาะกรรมการหรือระบบบน NAS — NAS เป็นคนยืนยันบทบาท
# ล็อกผู้ส่งไว้ที่ admin@ienas.site ที่เดียว
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["admin@ienas.site"]

# จำว่าคำขอไหนส่งอีเมลไปแล้ว — กันกดรัวจนโควตารายวัน (200 ฉบับ) หมด
[[kv_namespaces]]
binding = "NOTIFY_SENT"
id = "a47c1a39a31e4de39e988eaec2ba87d8"
