# workers/wrangler.nas.toml — Worker รูปเอกสารการยืมบน NAS (แยกจาก okmd-proxy)
#
# ทำไมแยก: ดูหัวไฟล์ workers/nas-entry.js — okmd-proxy อยู่บัญชีชุมนุมที่ตอนนี้ไม่มีใครเข้าได้
# ตัวนี้อยู่บัญชีส่วนตัวที่ทีมใช้งานอยู่ (vaumgasem@gmail.com)
#
# deploy:  npm run worker:nas-deploy
# ใส่ token ของ share:  npm run worker:nas   (เก็บเป็น Secret ฝั่ง Cloudflare ไม่อยู่ในไฟล์นี้)
#
# ไม่มี [triggers] ตั้งใจ — cron เตือนอีเมลรันอยู่ที่ okmd-proxy แล้ว
# ถ้าใส่ตรงนี้ด้วยจะได้อีเมลเตือนซ้ำสองฉบับ
account_id = "c120ec1f85adbda4cb1a94e4e79cf22d"
name = "iephoto-nas"
main = "nas-entry.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "https://iephoto.web.app"
# ปลายทาง WebDAV ของ public share — ไม่ลับ (ไม่มี token อยู่ในนี้)
NAS_WEBDAV_BASE = "https://nextcloud.ienas.site/public.php/webdav"
# ใช้ตรวจลายเซ็น Firebase ID token ว่าออกให้โปรเจกต์นี้จริง
FIREBASE_PROJECT_ID = "iephoto"
# named database "default" (ไม่ใช่ "(default)") — /notify อ่านบทบาทจาก users/{uid}
FIREBASE_DATABASE_ID = "default"

# ── อีเมลแจ้งเตือน (workers/notify.js) ─────────────────────────
# ienas.site เปิด Email Sending ไว้แล้วใน Cloudflare (Email Service → Email Sending)
MAIL_FROM = "admin@ienas.site"
NOTIFY_TO = "68030271@kmitl.ac.th"

# ล็อกผู้รับไว้ที่ binding — Cloudflare ปฏิเสธเองถ้าส่งไปที่อื่น
# ต้องเป็นที่อยู่ที่ยืนยันใน Email Routing → Destination addresses แล้ว
# (ส่งถึงที่อยู่ที่ยืนยันแล้วฟรีทุกแผน ส่งถึงที่อยู่อื่นต้องเปิด Workers Paid)
[[send_email]]
name = "EMAIL"
allowed_destination_addresses = ["68030271@kmitl.ac.th"]
allowed_sender_addresses = ["admin@ienas.site"]
