name: Send task/booking notifications

on:
  schedule:
    - cron: "0,30 * * * *" # ทุก 30 นาที (GitHub อาจดีเลย์เล็กน้อยตามภาระงาน) — ~1,440 นาที/เดือน ยังอยู่ในโควตาฟรี 2,000 นาที
  workflow_dispatch: {} # กดรันเองได้จาก Actions tab เพื่อทดสอบ

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Send notifications
        run: node scripts/send-notifications.cjs
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
