<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IE-Photo · ปิดปรับปรุงชั่วคราว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --faculty: #ef3961; --ink: #1d1d22; --muted: #6b6b76; --card: rgba(255,255,255,.86); --bg1: #ffe3ea; --bg2: #fff5f7; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f3f3f6; --muted: #a8a8b3; --card: rgba(30,30,36,.86); --bg1: #3a1622; --bg2: #16161b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    font-family: "IBM Plex Sans Thai", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1), var(--bg2));
  }
  .card {
    width: 100%; max-width: 26rem; background: var(--card); border-radius: 28px; padding: 32px 28px;
    text-align: center; box-shadow: 0 20px 60px rgba(239,57,97,.14); backdrop-filter: blur(12px);
  }
  .badge {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px; display: grid; place-items: center;
    color: var(--faculty); background: rgba(239,57,97,.1);
  }
  h1 { margin: 0 0 8px; font-size: 1.5rem; }
  p { margin: 0 0 12px; line-height: 1.65; color: var(--muted); }
  .when { color: var(--ink); font-weight: 600; }
  .new {
    display: inline-block; margin-top: 8px; padding: 12px 18px; border-radius: 16px; font-weight: 600;
    color: var(--faculty); background: rgba(239,57,97,.1); text-decoration: none; word-break: break-all;
  }
  small { display: block; margin-top: 20px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </div>
    <h1>ปิดปรับปรุงชั่วคราว</h1>
    <p>IE-Photo กำลังย้ายไปอยู่บนเซิร์ฟเวอร์ใหม่ของชุมนุม<br>ระหว่างนี้จองหรือยืมอุปกรณ์ไม่ได้</p>
    <p class="when">กลับมาใช้งานได้ประมาณ 14:30 น. วันนี้ (22 ก.ย.)</p>
    <p>ที่อยู่ใหม่ — ลิงก์เดิมจะพาไปเองอัตโนมัติ</p>
    <a class="new" href="https://iephoto.ienas.site/">iephoto.ienas.site</a>
    <small>ล็อกอินด้วยรหัสนักศึกษาและรหัสผ่านเดิมได้เลย ข้อมูลการจองทั้งหมดย้ายตามไปครบ</small>
  </main>
</body>
</html>
